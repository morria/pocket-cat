# Xcode shell for the FTX1 app. Regenerate after edits:
#   cd App && xcodegen generate
name: FTX1
options:
  bundleIdPrefix: radio.ftx1
  deploymentTarget:
    iOS: "17.0"
packages:
  FTX1:
    path: ..
targets:
  FTX1App:
    type: application
    platform: iOS
    sources:
      - FTX1App
    dependencies:
      - package: FTX1
        product: FTX1UI
    info:
      path: FTX1App/Info.plist
      properties:
        CFBundleDisplayName: Pocket Cat FTX1
        # Declared so TestFlight doesn't ask on every upload. The app uses
        # only Apple's BLE stack — no custom or non-exempt cryptography.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: >-
          FTX-1 connects to your Pocket Cat CAT bridge over Bluetooth to
          control the radio.
        UIBackgroundModes:
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUbiquitousContainers:
          iCloud.radio.ftx1.FTX1App:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: FTX-1
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: FTX1App/FTX1App.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.icloud-container-identifiers:
          - iCloud.radio.ftx1.FTX1App
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.radio.ftx1.FTX1App
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.w2asm.pocket-cat-ftx1
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 7Q2SS8772K
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    App icon source. Regenerate the asset-catalog PNG after editing:

      rsvg-convert -w 1024 -h 1024 Icon/AppIcon.svg -o /tmp/icon.png
      python3 -c 'from PIL import Image; \
        im=Image.open("/tmp/icon.png").convert("RGBA"); \
        f=Image.new("RGB",im.size,(21,31,41)); f.paste(im,mask=im.split()[3]); \
        f.save("QMXApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png")'

    The PNG must stay opaque — the App Store rejects icons with an alpha
    channel — hence the flatten onto the icon's own background colour.
    Corners are square: iOS applies the rounded mask itself.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24313f"/>
      <stop offset="1" stop-color="#151f29"/>
    </linearGradient>
    <filter id="txtshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- VFO dial: capsule ticks sweeping cool to warm, cream index mark at 12 -->
  <g>
    <path d="M 512.0 290.0 L 512.0 176.0" stroke="#f0e6d2" stroke-width="42" stroke-linecap="round"/>
    <path d="M 580.6 250.9 L 600.4 190.0" stroke="#5cb8b2" stroke-width="34" stroke-linecap="round"/>
    <path d="M 642.5 282.4 L 680.1 230.6" stroke="#5cb8b2" stroke-width="34" stroke-linecap="round"/>
    <path d="M 691.6 331.5 L 743.4 293.9" stroke="#5cb8b2" stroke-width="34" stroke-linecap="round"/>
    <path d="M 723.1 393.4 L 784.0 373.6" stroke="#5cb8b2" stroke-width="34" stroke-linecap="round"/>
    <path d="M 734.0 462.0 L 798.0 462.0" stroke="#74b48c" stroke-width="34" stroke-linecap="round"/>
    <path d="M 723.1 530.6 L 784.0 550.4" stroke="#74b48c" stroke-width="34" stroke-linecap="round"/>
    <path d="M 691.6 592.5 L 743.4 630.1" stroke="#74b48c" stroke-width="34" stroke-linecap="round"/>
    <path d="M 642.5 641.6 L 680.1 693.4" stroke="#74b48c" stroke-width="34" stroke-linecap="round"/>
    <path d="M 580.6 673.1 L 600.4 734.0" stroke="#74b48c" stroke-width="34" stroke-linecap="round"/>
    <path d="M 512.0 684.0 L 512.0 748.0" stroke="#e8c765" stroke-width="34" stroke-linecap="round"/>
    <path d="M 443.4 673.1 L 423.6 734.0" stroke="#e8c765" stroke-width="34" stroke-linecap="round"/>
    <path d="M 381.5 641.6 L 343.9 693.4" stroke="#e8c765" stroke-width="34" stroke-linecap="round"/>
    <path d="M 332.4 592.5 L 280.6 630.1" stroke="#e8c765" stroke-width="34" stroke-linecap="round"/>
    <path d="M 300.9 530.6 L 240.0 550.4" stroke="#e8c765" stroke-width="34" stroke-linecap="round"/>
    <path d="M 290.0 462.0 L 226.0 462.0" stroke="#e08e6f" stroke-width="34" stroke-linecap="round"/>
    <path d="M 300.9 393.4 L 240.0 373.6" stroke="#e08e6f" stroke-width="34" stroke-linecap="round"/>
    <path d="M 332.4 331.5 L 280.6 293.9" stroke="#e08e6f" stroke-width="34" stroke-linecap="round"/>
    <path d="M 381.5 282.4 L 343.9 230.6" stroke="#e08e6f" stroke-width="34" stroke-linecap="round"/>
    <path d="M 443.4 250.9 L 423.6 190.0" stroke="#e08e6f" stroke-width="34" stroke-linecap="round"/>
    <circle cx="512" cy="462" r="90" fill="none" stroke="#f0e6d2" stroke-width="32"/>
  </g>

  <text x="512" y="886" filter="url(#txtshadow)"
        font-family="Helvetica Neue" font-weight="bold" font-size="150"
        letter-spacing="4" text-anchor="middle" fill="#ffffff">QMX</text>
</svg>

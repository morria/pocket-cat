name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  host-tests:
    name: Host unit + e2e simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C test suites (ASan/UBSan)
        run: make -C esp32s3/test/host run
      - name: Python tools tests
        run: |
          pip install pytest pytest-timeout pyserial
          python -m pytest esp32s3/test/tools -q
      - name: Golden vectors byte-identical across firmware and iOS package
        run: |
          cmp esp32s3/test/vectors/ctrlproto.json \
              Tests/CATBridgeCoreTests/Resources/ctrlproto.json

  ios-library:
    name: CATBridgeKit (swift test + iOS build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and test (macOS host — Core + BLE fakes)
        run: swift test
      - name: iOS simulator build (compile-checks os(iOS) branches)
        run: |
          xcodebuild build \
            -scheme CATBridgeKit \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  ft891-app:
    name: FT-891 app (swift test + iOS build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/pocket-cat-ft891
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (FT891Kit + sim integration)
        run: swift test
      - name: iOS simulator build (FT891UI, SwiftUI surface)
        run: |
          xcodebuild build \
            -scheme FT891UI \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  qmx-app:
    name: QMX app (swift test + iOS build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/pocket-cat-qmx
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (QMXKit + sim integration)
        run: swift test
      - name: iOS simulator build (QMXUI, SwiftUI surface)
        run: |
          xcodebuild build \
            -scheme QMXUI \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  ftx1-app:
    name: FTX-1 app (swift test + iOS build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/pocket-cat-ftx1
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (FTX1Kit + sim integration)
        run: swift test
      - name: iOS simulator build (FTX1UI, SwiftUI surface)
        run: |
          xcodebuild build \
            -scheme FTX1UI \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  firmware-build:
    name: ESP-IDF build (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: esp32s3/firmware
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: cat_bridge-esp32s3
          path: |
            esp32s3/firmware/build/cat_bridge.bin
            esp32s3/firmware/build/bootloader/bootloader.bin
            esp32s3/firmware/build/partition_table/partition-table.bin
          if-no-files-found: error
